name: Reproduce OCR image quality experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reproduce.yml'
      - 'experiment.py'
      - 'build_report.py'
      - 'canonical.txt'
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore original auditable sources on first run
        shell: python
        env:
          PROJECT_SOURCE_ZLIB: ""
        run: |
          import os, json, base64, zlib
          from pathlib import Path
          data = json.loads(zlib.decompress(base64.b64decode(os.environ['PROJECT_SOURCE_ZLIB'])))
          for name, text in data.items():
              path = Path(name)
              if not path.exists():
                  path.write_text(text, encoding='utf-8')
      - name: Freeze source texts and design before main OCR runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan.json texts.json experiment.py build_report.py requirements.txt README.md LICENSE robots.txt .gitignore .gitattributes
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze original OCR samples and predeclared experiment design'
            git push
          fi
      - name: Install pinned free OCR engine, English data and font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr=5.3.4-1build5 tesseract-ocr-eng=1:4.1.0-2 fonts-dejavu-core=2.37-8
          python -m pip install -r requirements.txt
      - name: Execute every predeclared OCR case and calculate actual CER
        run: |
          python experiment.py
          python build_report.py
      - name: Save original evidence and static report in this repository only
        run: |
          git add index.html data images raw normalized references fonts models
          git diff --cached --quiet && exit 0
          git commit -m 'Record all nine actual OCR runs and measured character errors'
          git push
